[package]
name = "pi-agent-benchmark"
version = "0.1.0"
edition = "2021"
description = "Reproducible experiment contracts and append-only traces for the Pi agent memory platform"
license = "MIT"

[dependencies]
pi-agent-memory = { path = "../memory" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.14"
