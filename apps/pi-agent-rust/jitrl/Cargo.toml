[package]
name = "pi-agent-jitrl"
version = "0.1.0"
edition = "2021"
description = "Independent just-in-time reinforcement learning scorer for agent action recommendations"
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
default = []
# The HTTP adapter is only for the opt-in local-model smoke test. The core
# scorer remains transport-independent and keeps no dependency on the main
# agent's ModelClient.
local-model = ["dep:reqwest", "dep:serde_json", "dep:tokio"]

[[example]]
name = "local_model_smoke"
required-features = ["local-model"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "serde"] }

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "rustls-tls"]
optional = true

[dependencies.serde_json]
version = "1.0"
optional = true

[dependencies.tokio]
version = "1.41"
features = ["macros", "rt-multi-thread"]
optional = true
