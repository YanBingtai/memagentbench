[package]
name = "pi-agent-benchmark-adapter"
version = "0.1.0"
edition = "2021"
description = "Adapter from the Pi agent loop to benchmark-runner execution"
license = "MIT"

[dependencies]
pi-agent-rust = { path = ".." }
pi-agent-benchmark = { path = "../benchmark" }
pi-agent-benchmark-runner = { path = "../benchmark-runner" }
pi-agent-artifacts = { path = "../artifacts" }
pi-agent-memory = { path = "../memory" }
pi-agent-memory-remote = { path = "../memory-remote" }
pi-agent-runtime = { path = "../runtime" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
pi-agent-benchmark-evaluator = { path = "../benchmark-evaluator" }
tempfile = "3.14"
tokio = { version = "1.41", features = ["macros", "rt", "time"] }
wiremock = "0.6"
