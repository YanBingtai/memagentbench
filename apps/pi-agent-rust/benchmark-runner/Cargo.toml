[package]
name = "pi-agent-benchmark-runner"
version = "0.1.0"
edition = "2021"
description = "Execution runner for pluggable Pi agent memory benchmarks"
license = "MIT"

[dependencies]
pi-agent-benchmark = { path = "../benchmark" }
pi-agent-memory = { path = "../memory" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
tokio = { version = "1.41", features = ["macros", "rt", "time"] }

[dev-dependencies]
pi-agent-benchmark-evaluator = { path = "../benchmark-evaluator" }
pi-agent-memory-remote = { path = "../memory-remote" }
tempfile = "3.14"
