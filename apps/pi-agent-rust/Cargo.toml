# Cargo 读取这个文件，了解项目名称、Rust edition 和依赖库。
[workspace]
resolver = "2"
members = [
    ".",
    "agent-benchmark-adapter",
    "artifacts",
    "benchmark",
    "benchmark-evaluator",
    "benchmark-runner",
    "jitrl",
    "memory",
    "memory-agent",
    "memory-remote",
    "runtime",
    "runtime-adapter",
]
default-members = ["."]

# Keep package metadata and dependency versions in one place while the
# workspace is gradually split into capability-oriented crates.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rustix = { version = "1.1", features = ["fs"] }
thiserror = "2.0"
tempfile = "3.14"
tokio = { version = "1.41", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
wiremock = "0.6"
pi-agent-runtime = { path = "runtime" }

[workspace.lints]
rust = {}

[package]
name = "pi-agent-rust"
version.workspace = true
edition.workspace = true
description = "A small Rust learning implementation of a Pi-style tool-calling agent"
license.workspace = true

[lints]
workspace = true

[dependencies]
# 解析终端参数，例如 --config 和 --prompt；derive 用于通过结构体生成解析代码。
clap = { workspace = true }
# 发送 HTTP 请求调用模型；启用 JSON 和 HTTPS 支持。
reqwest = { workspace = true }
# 在 Rust 结构体与外部数据之间转换；serde_json 负责具体的 JSON 格式。
serde = { workspace = true }
serde_json = { workspace = true }
# 解析 SKILL.md 的 YAML frontmatter；与 Codex 的 Skill 解析边界保持一致。
serde_yaml = { workspace = true }
# Descriptor-relative filesystem operations keep workspace writes inside the
# already-validated directory even when another process changes symlinks.
rustix = { workspace = true }
# 为配置、模型和工具定义可读的错误类型。
thiserror = { workspace = true }
# Own the per-session policy and per-call cancellation leases.
tempfile = { workspace = true }
# 运行 async/await 异步代码，提供文件 I/O、超时等功能。
tokio = { workspace = true }
# 解析运行时配置文件，如 config.toml。
toml = { workspace = true }
# 记录程序日志；tracing-subscriber 设置日志输出格式和过滤级别。
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# 为会话与事件生成唯一标识。
uuid = { workspace = true }
# Runtime admission and action lifecycle ledger.
pi-agent-runtime = { workspace = true }

[dev-dependencies]
# 测试使用独立临时目录，wiremock 提供本地模拟 HTTP 服务。
wiremock = { workspace = true }
