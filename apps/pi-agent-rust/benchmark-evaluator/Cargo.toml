[package]
name = "pi-agent-benchmark-evaluator"
version = "0.1.0"
edition = "2021"
description = "Offline evaluators for Pi agent memory benchmark traces"
license = "MIT"

[dependencies]
pi-agent-benchmark = { path = "../benchmark" }
pi-agent-runtime = { path = "../runtime" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.14"
