[package]
name = "pi-agent-memory-remote"
version = "0.1.0"
edition = "2021"
description = "JSON HTTP adapter for external Pi agent memory methods"
license = "MIT"

[dependencies]
pi-agent-memory = { path = "../memory" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
